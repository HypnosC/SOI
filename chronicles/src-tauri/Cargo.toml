[package]
name = "chronicles-soi-next"
version = "0.1.0"
description = "Chronicles of SOI timeline + map"
authors = ["you"]
edition = "2021"

[lib]
name = "chronicles_soi_next_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
