<head>
<meta charset="utf-8">

<title>Chronicles of SOI · 时空结构原型 v2</title>
<style>

  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font:13px/1.5 "Segoe UI",PingFang SC,"Microsoft YaHei",sans-serif;overflow:hidden}
  #app{display:flex;flex-direction:column;height:100%}
  header{display:flex;align-items:center;gap:14px;padding:9px 16px;
    border-bottom:1px solid var(--line);background:var(--panel);flex:0 0 auto}
  h1{font-size:14px;margin:0;font-weight:600}
  .sub{color:var(--sub);font-size:11.5px}
  .spacer{flex:1}
  .legend{display:flex;gap:12px;font-size:11.5px;color:var(--sub);align-items:center}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
  .pill{border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--sub);font-size:11.5px}
  canvas{display:block;flex:1 1 auto;cursor:grab}
  canvas.dragging{cursor:grabbing}
  footer{display:flex;align-items:center;gap:16px;padding:7px 16px;
    border-top:1px solid var(--line);background:var(--panel);font-size:11.5px;color:var(--sub);flex:0 0 auto}

// ============================================================
// 视图：★ X 与 Y 完全解耦 ★
//   X：时间 —— 可缩放、可平移
//   Y：泳道 —— 固定像素布局，随画布高度自适应，永不缩放
//   这就是「结构视图」与「普通画布」的根本区别
// ============================================================
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;

const PX_PER_YEAR = 1;                  // 基准：1 年 1 世界像素
let scaleX = 1;                          // 时间缩放（仅作用于 X）
let offsetX = 0;                         // 时间平移（仅作用于 X）

// Y 方向固定布局（屏幕像素）
const BAND_Y  = 22, BAND_H = 46;        // 时期带
const DENS_Y  = BAND_Y + BAND_H + 10;   // 密度条
const DENS_H  = 26;
const LANE_TOP = DENS_Y + DENS_H + 22;
let   LANE_H  = 82;                     // 自适应
const AXIS_H  = 46;

const sxOf  = (year) => (year - 0) * PX_PER_YEAR * scaleX + offsetX;
const xToYear = (sx) => Math.round((sx - offsetX) / (PX_PER_YEAR * scaleX));
function fmtYear(y){ return y < 0 ? '前' + (-y) : '' + y; }

function layout() {
  const bottom = H - AXIS_H - 8;
  LANE_H = Math.max(46, (bottom - LANE_TOP) / LANES.length);
}

function fitAll() {
  const span = (YEARS_FULL[1] - YEARS_FULL[0]) * PX_PER_YEAR;
  scaleX = (W - 40) / span;
  offsetX = 20 - YEARS_FULL[0] * PX_PER_YEAR * scaleX;
}

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.floor(W * DPR); cv.height = Math.floor(H * DPR);
  layout();
}

let hatch = null;
function makeHatch(){
  const p = document.createElement('canvas'); p.width = p.height = 8;
  const c = p.getContext('2d');
  c.strokeStyle = 'rgba(255,255,255,0.16)'; c.lineWidth = 1.4;
  c.beginPath(); c.moveTo(0,8); c.lineTo(8,0); c.stroke();
  return ctx.createPattern(p,'repeat');
}

// ============================================================
// 绘制（全部在屏幕坐标，不再有 ctx.scale 的纵向缩放）
// ============================================================
function draw(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = '#0b0c0f';
  ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if (!hatch) hatch = makeHatch();

  drawBands();
  drawDensity();
  drawLanes();
  drawEvents();
  drawAxis();

  const a = xToYear(0), b = xToYear(W);
  document.getElementById('range').textContent =
    `${fmtYear(a)} — ${fmtYear(b)}　·　时间密度 ${(scaleX*100).toFixed(1)}%`;
}

// ---- ① 时期带：骨架。这个 Demo 里最核心的一层 ----
function drawBands(){
  ctx.textBaseline = 'middle';
  for (const p of PERIODS){
    const x0 = sxOf(p.s), x1 = sxOf(p.e + 1);
    const w = Math.max(x1 - x0, 1);
    if (x1 < -40 || x0 > W + 40) continue;

    ctx.globalAlpha = p.cert === 'vague' ? 0.40 : p.cert === 'approx' ? 0.66 : 0.90;
    ctx.fillStyle = p.c;
    ctx.fillRect(x0, BAND_Y, w, BAND_H);
    ctx.globalAlpha = 1;

    // 模糊边界用斜纹表示"我不确定这一段"
    if (p.cert !== 'exact'){
      ctx.save();
      ctx.beginPath(); ctx.rect(x0, BAND_Y, w, BAND_H); ctx.clip();
      ctx.fillStyle = hatch;
      ctx.fillRect(x0, BAND_Y, w, BAND_H);
      ctx.restore();
    }

    ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x0+.5, BAND_Y); ctx.lineTo(x0+.5, BAND_Y+BAND_H); ctx.stroke();

    if (w > 26){
      ctx.font = '600 17px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      const label = w > ctx.measureText(p.n).width + 10 ? p.n : p.n.slice(0,1);
      ctx.fillText(label, x0 + 5, BAND_Y + BAND_H/2 + 1);
    }
  }
  // 带下缘阴影
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(0, BAND_Y+BAND_H, W, 3);
}

// ---- ② 密度条：任意缩放下都能看出"哪个朝代事件多" ----
function drawDensity(){
  const counts = PERIODS.map(p => EVENTS.filter(e => e.p === p.n).length);
  const maxC = Math.max(1, ...counts);
  ctx.fillStyle = 'rgba(255,255,255,0.03)';
  ctx.fillRect(0, DENS_Y, W, DENS_H);

  PERIODS.forEach((p, i) => {
    const x0 = sxOf(p.s), x1 = sxOf(p.e + 1);
    const w = Math.max(x1 - x0, 1);
    if (x1 < 0 || x0 > W) return;
    const h = (counts[i] / maxC) * (DENS_H - 4);
    if (h <= 0) return;
    // 极窄时画成一条竖线，保证缩到全览也看得见
    const bw = Math.max(w - 1, 1.5);
    ctx.fillStyle = p.c;
    ctx.globalAlpha = 0.85;
    ctx.fillRect(x0, DENS_Y + DENS_H - 2 - h, bw, h);
    ctx.globalAlpha = 1;
  });

  ctx.font = '10px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillStyle = 'rgba(139,147,167,0.75)';
  ctx.textBaseline = 'middle';
  ctx.fillText('事件量', 6, DENS_Y + DENS_H/2);
}

// ---- ③ 泳道：领域。Y 固定，永不随缩放坍缩 ----
function drawLanes(){
  ctx.textBaseline = 'middle';
  LANES.forEach((lane, i) => {
    const top = LANE_TOP + i * LANE_H;
    const cy = top + LANE_H/2;

    ctx.fillStyle = i % 2 ? 'rgba(255,255,255,0.015)' : 'rgba(255,255,255,0.032)';
    ctx.fillRect(0, top, W, LANE_H);

    ctx.strokeStyle = 'rgba(50,55,68,0.8)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, top+.5); ctx.lineTo(W, top+.5); ctx.stroke();

    ctx.strokeStyle = 'rgba(255,255,255,0.055)';
    ctx.beginPath(); ctx.moveTo(0, cy+.5); ctx.lineTo(W, cy+.5); ctx.stroke();

    ctx.fillStyle = lane.color;
    ctx.fillRect(0, cy - 10, 3, 20);
    ctx.font = '600 12px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillStyle = 'rgba(232,234,240,0.92)';
    ctx.fillText(lane.name, 11, cy);
  });
  const bottom = LANE_TOP + LANES.length * LANE_H;
  ctx.strokeStyle = 'rgba(50,55,68,0.9)';
  ctx.beginPath(); ctx.moveTo(0, bottom+.5); ctx.lineTo(W, bottom+.5); ctx.stroke();
}

// ---- ④ 事件 ----
function drawEvents(){
  ctx.textBaseline = 'middle';
  const showLabel = scaleX > 0.8;         // 时间密度足够才画文字
  const buckets = new Map();              // 同泳道同年份的纵向错开

  for (const ev of EVENTS){
    const li = LANES.findIndex(l => l.id === ev.lane);
    if (li < 0) continue;
    const lane = LANES[li];
    const cy = LANE_TOP + li * LANE_H + LANE_H/2;
    const x = sxOf(ev.y);
    if (x < -160 || x > W + 160) continue;

    const key = li + ':' + ev.y;
    const k = buckets.get(key) || 0;
    buckets.set(key, k + 1);
    const yy = cy + (k % 3 - 1) * 13;

    // 从时期带垂下的引导线：体现"这个点属于哪个块"
    if (showLabel){
      ctx.strokeStyle = 'rgba(255,255,255,0.075)';
      ctx.beginPath(); ctx.moveTo(x+.5, BAND_Y+BAND_H); ctx.lineTo(x+.5, yy); ctx.stroke();
    }

    ctx.beginPath(); ctx.arc(x, yy, 4.4, 0, Math.PI*2);
    ctx.fillStyle = lane.color; ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.lineWidth = 1; ctx.stroke();

    if (showLabel){
      ctx.font = '11.5px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillStyle = 'rgba(214,219,232,0.9)';
      ctx.fillText(ev.t, x + 8, yy - 8);
      ctx.font = '10px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillStyle = 'rgba(139,147,167,0.9)';
      ctx.fillText(fmtYear(ev.y), x + 8, yy + 5);
    }
  }
}

// ---- ⑤ 时间刻度 ----
function drawAxis(){
  const yy = H - AXIS_H + 8;
  ctx.strokeStyle = 'rgba(70,78,94,0.95)'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(0, yy+.5); ctx.lineTo(W, yy+.5); ctx.stroke();

  const yearsVisible = W / (PX_PER_YEAR * scaleX);
  const rough = Math.max(yearsVisible / 12, 1);
  const pow10 = 10 ** Math.floor(Math.log10(rough));
  const norm = rough / pow10;
  const step = norm < 1.5 ? pow10 : norm < 3.5 ? 2*pow10 : norm < 7.5 ? 5*pow10 : 10*pow10;

  const y0 = Math.floor(xToYear(0)/step)*step;
  const y1 = xToYear(W) + step;
  ctx.textBaseline = 'top';
  ctx.font = '11px "PingFang SC","Microsoft YaHei",sans-serif';
  for (let y = y0; y <= y1; y += step){
    const x = sxOf(y);
    ctx.strokeStyle = 'rgba(70,78,94,0.7)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x+.5, yy); ctx.lineTo(x+.5, yy+6); ctx.stroke();
    ctx.fillStyle = 'rgba(139,147,167,0.95)';
    ctx.fillText(y === 0 ? '公元元年' : fmtYear(y), x + 3, yy + 8);
  }
}

// ============================================================
// 交互
// ============================================================
cv.addEventListener('wheel', (e) => {
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  const sxp = e.clientX - r.left;
  const year = xToYear(sxp);
  const k = e.deltaY > 0 ? 0.88 : 1.136;
  scaleX = Math.min(60, Math.max(0.02, scaleX * k));
  offsetX = sxp - year * PX_PER_YEAR * scaleX;   // 以光标处年份为锚点缩放
  draw();
}, { passive:true });

let dragging = false, lx = 0;
cv.addEventListener('pointerdown', e => {
  dragging = true; lx = e.clientX;
  cv.classList.add('dragging'); cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => {
  if (!dragging) return;
  offsetX += e.clientX - lx;                     // 只平移 X
  lx = e.clientX; draw();
});
const stop = () => { dragging = false; cv.classList.remove('dragging'); };
cv.addEventListener('pointerup', stop);
cv.addEventListener('pointercancel', stop);
cv.addEventListener('dblclick', () => { fitAll(); draw(); });

const ro = new ResizeObserver(() => { resize(); draw(); });
ro.observe(cv);
requestAnimationFrame(() => { resize(); fitAll(); draw(); });
</script>
</body>
</html>
